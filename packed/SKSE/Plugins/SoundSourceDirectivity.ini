[General]
; Turns the plugin on or off.
bEnabled = true
; Voices get quieter when the speaker faces away from you (Steam Audio directivity).
bDirectivity = true
; Steam Audio dipole weight, 0 to 1 (0 = no directivity, higher = quieter behind the speaker).
fDipoleWeight = 0.275
; Steam Audio dipole power, 0 to 4 (higher = narrower, the drop starts closer to the front).
fDipolePower = 1.0
; Writes a summary every 10 seconds to SoundSourceDirectivity.log.
bLog = false
